<script id="dataset" type="application/json">{"questions": [{"id": "q24-1", "year": 2024, "edition": 16, "number": "一（1）", "title": "消去低阶项，找到极限的主角", "type": "填空题", "points": 6, "difficulty": 2, "topics": ["taylor", "limit"], "stem": "求下列极限。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\lim_{x\\to0}\\frac{\\ln(1+x^2)-x^2}{\\sin^4x}\"><mrow><munder><mo movablelimits=\"true\" largeop=\"true\">lim<\/mo><mrow><mi>x<\/mi><mo>→<\/mo><mn>0<\/mn><\/mrow><\/munder><mfrac><mrow><mi mathvariant=\"normal\">ln<\/mi><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>)<\/mo><mo>-<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi mathvariant=\"normal\">sin<\/mi><mn>4<\/mn><\/msup><mi>x<\/mi><\/mrow><\/mfrac><\/mrow><\/math>", "tex": "\\lim_{x\\to0}\\frac{\\ln(1+x^2)-x^2}{\\sin^4x}", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"-\\frac12\"><mrow><mo>-<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>", "answerText": "-\\frac12", "steps": [{"title": "先判断需要保留到哪一阶", "body": "<p>分母的主要量级是四阶。分子的二阶项会被减去，所以只写 ln(1+t) ≈ t 不够。<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\sin^4x=x^4+o(x^4)\"><mrow><msup><mi mathvariant=\"normal\">sin<\/mi><mn>4<\/mn><\/msup><mi>x<\/mi><mo>=<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>+<\/mo><mi>o<\/mi><mo>(<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>)<\/mo><\/mrow><\/math>", "why": "因为 sin x / x → 1，四次方的比值也趋于 1。要得到有限的非零极限，需要找到分子的四阶主项。"}, {"title": "令 t = x²，展开对数", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\ln(1+t)=t-\\frac{t^2}{2}+o(t^2)\"><mrow><mi mathvariant=\"normal\">ln<\/mi><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>t<\/mi><mo>)<\/mo><mo>=<\/mo><mi>t<\/mi><mo>-<\/mo><mfrac><mrow><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mi>o<\/mi><mo>(<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>)<\/mo><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\ln(1+x^2)-x^2=-\\frac{x^4}{2}+o(x^4)\"><mrow><mi mathvariant=\"normal\">ln<\/mi><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>)<\/mo><mo>-<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mo>-<\/mo><mfrac><mrow><msup><mi>x<\/mi><mn>4<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mi>o<\/mi><mo>(<\/mo><msup><mi>x<\/mi><mn>4<\/mn><\/msup><mo>)<\/mo><\/mrow><\/math>", "why": "把 t 换成 x²，t² 就是 x⁴；原式中另有 −x²，恰好消掉展开式的第一项。"}, {"title": "同时除以 x⁴，读取系数", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\frac{\\ln(1+x^2)-x^2}{\\sin^4x}=\\frac{-\\frac12+o(1)}{1+o(1)}\\to-\\frac12\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">ln<\/mi><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>)<\/mo><mo>-<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><msup><mi mathvariant=\"normal\">sin<\/mi><mn>4<\/mn><\/msup><mi>x<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><mo>-<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mi>o<\/mi><mo>(<\/mo><mn>1<\/mn><mo>)<\/mo><\/mrow><mrow><mn>1<\/mn><mo>+<\/mo><mi>o<\/mi><mo>(<\/mo><mn>1<\/mn><mo>)<\/mo><\/mrow><\/mfrac><mo>→<\/mo><mo>-<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>", "why": "分子分母在去心邻域内同时除以 x⁴，再使用商的极限法则。"}], "hint": "先看分母的阶数：sin⁴x 与 x⁴ 同阶。分子中哪些低阶项会消掉？", "mistake": ["不能在相减的两个项中直接用首项等价替换，否则会把真正的主项消掉。", "对数展开的第二项是 −t²/2，负号不要漏。"], "method": "相减型极限：先找抵消，再决定展开阶数。不是展开越多越好，而是刚好保留第一个不为零的项。", "variant": "把分母换成 x⁴ 再算一次，比较两种写法为什么给出同一极限。", "pages": "1", "accepted": ["-1/2", "-0.5", "−1/2"]}, {"id": "q24-2", "year": 2024, "edition": 16, "number": "一（2）", "title": "对称区间上的积分，不必硬算", "type": "填空题", "points": 6, "difficulty": 2, "topics": ["symmetry"], "stem": "计算定积分。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_{-2}^{2}\\left(x^3\\cos^5x+\\sqrt{4-x^2}\\right)\\,dx\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mrow><mo>-<\/mo><mn>2<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/munderover><mo>(<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><msup><mi mathvariant=\"normal\">cos<\/mi><mn>5<\/mn><\/msup><mi>x<\/mi><mo>+<\/mo><msqrt><mrow><mn>4<\/mn><mo>-<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>", "tex": "\\int_{-2}^{2}\\left(x^3\\cos^5x+\\sqrt{4-x^2}\\right)\\,dx", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"2\\pi\"><mrow><mn>2<\/mn><mo>π<\/mo><\/mrow><\/math>", "answerText": "2\\pi", "steps": [{"title": "先拆开，再看奇偶性", "body": "<p>x³ 是奇函数，cos⁵x 是偶函数，它们的乘积是奇函数。<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_{-2}^{2}x^3\\cos^5x\\,dx=0\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mrow><mo>-<\/mo><mn>2<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/munderover><msup><mi>x<\/mi><mn>3<\/mn><\/msup><msup><mi mathvariant=\"normal\">cos<\/mi><mn>5<\/mn><\/msup><mi>x<\/mi><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "why": "奇函数在关于原点对称的区间上积分为零。这里被积函数在闭区间上连续，积分存在。"}, {"title": "识别剩余部分的几何意义", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"y=\\sqrt{4-x^2},\\quad -2\\le x\\le2\"><mrow><mi>y<\/mi><mo>=<\/mo><msqrt><mrow><mn>4<\/mn><mo>-<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>,<\/mo><mo> <\/mo><mo>-<\/mo><mn>2<\/mn><mo>≤<\/mo><mi>x<\/mi><mo>≤<\/mo><mn>2<\/mn><\/mrow><\/math><p>它是半径为 2 的上半圆。剩下的定积分就是该半圆的面积。<\/p>", "why": "先把方程平方得到 x²+y²=4，再结合 y≥0，便能确定是上半圆而不是整个圆。"}, {"title": "用面积公式完成计算", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_{-2}^{2}\\sqrt{4-x^2}\\,dx=\\frac12\\pi\\cdot2^2=2\\pi\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mrow><mo>-<\/mo><mn>2<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/munderover><msqrt><mrow><mn>4<\/mn><mo>-<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>=<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>π<\/mo><mo>·<\/mo><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>=<\/mo><mn>2<\/mn><mo>π<\/mo><\/mrow><\/math>", "why": "圆面积是 πr²，上半圆只取一半。原积分的奇函数部分已经为零。"}], "hint": "这道题不必求两个原函数。先检查第一项的奇偶性，再看根号对应哪条曲线。", "mistake": ["奇偶性判断要看乘积整体，不能因为有 cos 就认为整项是偶函数。", "根号只表示上半圆，面积需要乘 1/2。"], "method": "计算定积分前，先依次检查对称性、几何意义和周期性。结构识别常常比积分技巧更快。", "variant": "把 x³cos⁵x 改成任意连续奇函数，这道题的积分值会改变吗？", "pages": "1", "accepted": ["2pi", "2π", "2*pi", "π*2"]}, {"id": "q24-3", "year": 2024, "edition": 16, "number": "一（3）", "title": "隐函数二阶导数：别漏链式法则", "type": "填空题", "points": 6, "difficulty": 3, "topics": ["implicit"], "stem": "设 y = y(x) 由下式确定，求在 (0, 0) 处的二阶导数。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"e^{3y}+\\int_0^{x+y}\\cos t^2\\,dt=1,\\qquad y^{\\prime\\prime}(0)=?\"><mrow><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>y<\/mi><\/mrow><\/msup><mo>+<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><\/mrow><\/munderover><mi mathvariant=\"normal\">cos<\/mi><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mspace width=\"0.15em\"/><mi>d<\/mi><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><mo> <\/mo><msup><mi>y<\/mi><mrow><mo>′<\/mo><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mn>0<\/mn><mo>)<\/mo><mo>=<\/mo><mo>?<\/mo><\/mrow><\/math>", "tex": "e^{3y}+\\int_0^{x+y}\\cos t^2\\,dt=1,\\qquad y^{\\prime\\prime}(0)=?", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"-\\frac9{64}\"><mrow><mo>-<\/mo><mfrac><mn>9<\/mn><mrow><mn>64<\/mn><\/mrow><\/mfrac><\/mrow><\/math>", "answerText": "-\\frac9{64}", "steps": [{"title": "两边对 x 求一次导数", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"3y^{\\prime}e^{3y}+(1+y^{\\prime})\\cos((x+y)^2)=0\"><mrow><mn>3<\/mn><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>y<\/mi><\/mrow><\/msup><mo>+<\/mo><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>)<\/mo><mi mathvariant=\"normal\">cos<\/mi><mo>(<\/mo><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><msup><mo>)<\/mo><mn>2<\/mn><\/msup><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "why": "积分的上限是 x+y(x)，先取被积函数在上限处的值，再乘上限的导数 1+y′。此处 cos(x+y)² 表示 cos((x+y)²)。"}, {"title": "先求出一阶导数在原点的值", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"3y^{\\prime}(0)+1+y^{\\prime}(0)=0\"><mrow><mn>3<\/mn><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mn>0<\/mn><mo>)<\/mo><mo>+<\/mo><mn>1<\/mn><mo>+<\/mo><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mn>0<\/mn><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"y^{\\prime}(0)=-\\frac14\"><mrow><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mn>0<\/mn><mo>)<\/mo><mo>=<\/mo><mo>-<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mrow><\/math>", "why": "代入 x=0、y=0 后，指数和余弦都等于 1。先保存 y′(0)，下一次求导会用到它的平方。"}, {"title": "再求导并在原点代值", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"3y^{\\prime\\prime}e^{3y}+9(y^{\\prime})^2e^{3y}+y^{\\prime\\prime}\\cos((x+y)^2)\"><mrow><mn>3<\/mn><msup><mi>y<\/mi><mrow><mo>′<\/mo><mo>′<\/mo><\/mrow><\/msup><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>y<\/mi><\/mrow><\/msup><mo>+<\/mo><mn>9<\/mn><mo>(<\/mo><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><msup><mo>)<\/mo><mn>2<\/mn><\/msup><msup><mi>e<\/mi><mrow><mn>3<\/mn><mi>y<\/mi><\/mrow><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mrow><mo>′<\/mo><mo>′<\/mo><\/mrow><\/msup><mi mathvariant=\"normal\">cos<\/mi><mo>(<\/mo><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><msup><mo>)<\/mo><mn>2<\/mn><\/msup><mo>)<\/mo><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"-2(x+y)(1+y^{\\prime})^2\\sin((x+y)^2)=0\"><mrow><mo>-<\/mo><mn>2<\/mn><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mo>)<\/mo><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><msup><mo>)<\/mo><mn>2<\/mn><\/msup><mi mathvariant=\"normal\">sin<\/mi><mo>(<\/mo><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><msup><mo>)<\/mo><mn>2<\/mn><\/msup><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"4y^{\\prime\\prime}(0)+\\frac9{16}=0\"><mrow><mn>4<\/mn><msup><mi>y<\/mi><mrow><mo>′<\/mo><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mn>0<\/mn><mo>)<\/mo><mo>+<\/mo><mfrac><mn>9<\/mn><mrow><mn>16<\/mn><\/mrow><\/mfrac><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "why": "两项乘积都要使用乘积法则；最后一项含因子 x+y，所以在 (0,0) 处为零。"}, {"title": "解出二阶导数", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"y^{\\prime\\prime}(0)=-\\frac9{64}\"><mrow><msup><mi>y<\/mi><mrow><mo>′<\/mo><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mn>0<\/mn><mo>)<\/mo><mo>=<\/mo><mo>-<\/mo><mfrac><mn>9<\/mn><mrow><mn>64<\/mn><\/mrow><\/mfrac><\/mrow><\/math>", "why": "由 4y″(0)=−9/16，两边再除以 4。"}], "hint": "先求 y′(0)，再做第二次求导。积分项求导时别忘了上限也是 x 的函数。", "mistake": ["把变上限积分的导数写成 cos((x+y)²)，却遗漏因子 1+y′。", "求第二次导数时，9(y′)²e³ʸ 这一项很容易漏掉。"], "method": "隐函数高阶求导：每次求导都把 y 当成 y(x)，并及时记录已知点的一阶导数。", "variant": "把 e³ʸ 改成 eᵃʸ（a ≠ −1），试着仅求 y′(0)，检查结果对参数的依赖。", "pages": "1–2", "accepted": ["-9/64", "-0.140625"]}, {"id": "q24-4", "year": 2024, "edition": 16, "number": "一（4）", "title": "复合函数混合偏导：按路径展开", "type": "填空题", "points": 6, "difficulty": 3, "topics": ["chain"], "stem": "设 z = f(xy, eˣ⁺ʸ)，其中 f 具有二阶连续偏导数。记 f₁、f₂ 为对第一、第二个自变量的偏导，求 zₓᵧ。", "formula": "<math xmlns=\"http:/ sup><mi>e<\/mi><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><\/mrow><\/msup><\/mrow><\/math>", "why": "先把复合层次拆开：f 的自变量是 u、v，而不是直接把 f₁ 理解成对 x 求导。"}, {"title": "先求关于 x 的偏导", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"z_x=yf_1+e^{x+y}f_2\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mi>y<\/mi><msub><mi>f<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><\/mrow><\/msup><msub><mi>f<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math>", "why": "每条路径的导数相乘，再对两条路径求和。所有 f 的偏导最终都在 (xy,eˣ⁺ʸ) 处取值。"}, {"title": "再对 y 求导，保留乘积的两部分", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"z_{xy}=f_1+y(xf_{11}+e^{x+y}f_{12})\"><mrow><msub><mi>z<\/mi><mrow><mi>x<\/mi><mi>y<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>f<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><mi>y<\/mi><mo>(<\/mo><mi>x<\/mi><msub><mi>f<\/mi><mrow><mn>11<\/mn><\/mrow><\/msub><mo>+<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><\/mrow><\/msup><msub><mi>f<\/mi><mrow><mn>12<\/mn><\/mrow><\/msub><mo>)<\/mo><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"+e^{x+y}f_2+e^{x+y}(xf_{21}+e^{x+y}f_{22})\"><mrow><mo>+<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><\/mrow><\/msup><msub><mi>f<\/mi><mn>2<\/mn><\/msub><mo>+<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><msub><mi>f<\/mi><mrow><mn>21<\/mn><\/mrow><\/msub><mo>+<\/mo><msup><mi>e<\/mi><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><\/mrow><\/msup><msub><mi>f<\/mi><mrow><mn>22<\/mn><\/mrow><\/msub><mo>)<\/mo><\/mrow><\/math>", "why": "前面的 y、eˣ⁺ʸ 也随 y 变化，必须分别求导；后面的 f₁、f₂ 又要各走一次链式法则。"}, {"title": "利用混合偏导连续性合并", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"f_{21}=f_{12}\"><mrow><msub><mi>f<\/mi><mrow><mn>21<\/mn><\/mrow><\/msub><mo>=<\/mo><msub><mi>f<\/mi><mrow><mn>12<\/mn><\/mrow><\/msub><\/mrow><\/mat nswerText": "3+\\sqrt{29}", "steps": [{"title": "两个约束，对应两个乘数", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"L=x+2y+3z-\\lambda(x-y+z-1)-\\mu(x^2+y^2-1)\"><mrow><mi>L<\/mi><mo>=<\/mo><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mi>y<\/mi><mo>+<\/mo><mn>3<\/mn><mi>z<\/mi><mo>-<\/mo><mo>λ<\/mo><mo>(<\/mo><mi>x<\/mi><mo>-<\/mo><mi>y<\/mi><mo>+<\/mo><mi>z<\/mi><mo>-<\/mo><mn>1<\/mn><mo>)<\/mo><mo>-<\/mo><mo>μ<\/mo><mo>(<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>-<\/mo><mn>1<\/mn><mo>)<\/mo><\/mrow><\/math>", "why": "不能只引入一个乘数。平面约束与圆柱约束分别对应 λ 与 μ。"}, {"title": "写出驻点条件", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"1-\\lambda-2\\mu x=0,\\quad2+\\lambda-2\\mu y=0\"><mrow><mn>1<\/mn><mo>-<\/mo><mo>λ<\/mo><mo>-<\/mo><mn>2<\/mn><mo>μ<\/mo><mi>x<\/mi><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mo> <\/mo><mn>2<\/mn><mo>+<\/mo><mo>λ<\/mo><mo>-<\/mo><mn>2<\/mn><mo>μ<\/mo><mi>y<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"3-\\lambda=0,\\quad x-y+z=1,\\quad x^2+y^2=1\"><mrow><mn>3<\/mn><mo>-<\/mo><mo>λ<\/mo><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mo> <\/mo><mi>x<\/mi><mo>-<\/mo><mi>y<\/mi><mo>+<\/mo><mi>z<\/mi><mo>=<\/mo><mn>1<\/mn><mo>,<\/mo><mo> <\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>1<\/mn><\/mrow><\/math>", "why": "对 x、y、z 分别求偏导，再加回两个原约束。对 z 求导最快得到 λ=3。"}, {"title": "由约束解出候选点", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\lambda=3,\\quad x=-\\frac1\\mu,\\quad y=\\frac5{2\\mu}\"><mrow><mo>λ<\/mo><mo>=<\/mo><mn>3<\/mn><mo>,<\/mo><mo> <\/mo><mi>x<\/mi><mo>=<\/mo><mo>-<\/mo><mfrac><mn>1<\/mn><mo>μ<\/mo><\/mfrac><mo>,<\/mo><mo> <\/mo><mi>y<\/mi><mo>=<\/mo><mfrac><mn>5<\/mn><mrow><mn>2<\/mn><mo>μ<\/mo><\/mrow><\/mfrac><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\ n\"><mrow><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>=<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><munderover><mo movablelimits=\"true\" largeop=\"true\">∑<\/mo><mrow><mi>n<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><mrow><mo>∞<\/mo><\/mrow><\/munderover><mo>(<\/mo><mo>-<\/mo><mn>1<\/mn><msup><mo>)<\/mo><mi>n<\/mi><\/msup><mo>(<\/mo><mn>1<\/mn><mo>-<\/mo><mfrac><mn>1<\/mn><mrow><msup><mn>5<\/mn><mrow><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/mfrac><mo>)<\/mo><mo>(<\/mo><mi>x<\/mi><mo>-<\/mo><mn>2<\/mn><msup><mo>)<\/mo><mi>n<\/mi><\/msup><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"|x-2|&lt;1\"><mrow><mo>|<\/mo><mi>x<\/mi><mo>-<\/mo><mn>2<\/mn><mo>|<\/mo><mo>&lt;<\/mo><mn>1<\/mn><\/mrow><\/math>", "why": "几何级数 1/(1+t)=∑(−1)ⁿtⁿ 在 |t|<1 时成立。两项共同适用的范围是 |x−2|<1。"}, {"title": "单独检查两个端点", "body": "<p>x=1 与 x=3 时，级数通项都不趋于 0，因此两端点均发散。<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"1&lt;x&lt;3\"><mrow><mn>1<\/mn><mo>&lt;<\/mo><mi>x<\/mi><mo>&lt;<\/mo><mn>3<\/mn><\/mrow><\/math>", "why": "收敛半径只能确定开区间，端点必须代入级数另外判断。此题两个端点连通项趋零的必要条件都不满足。"}], "hint": "先拆部分分式，再把所有分母改写为“常数 + (x−2)”的形式。", "mistake": ["忘了展开中心是 2，误写成 x 的幂级数。", "只求收敛半径，不检查两个端点。"], "method": "有理函数展开优先试部分分式与几何级数；展开中心决定幂的形式，收敛域还需端点检验。", "variant": "仅改变展开中心到 x=0，哪一个分母的零点会先限制收敛半径？", "pages": "4", "accepted": []}, {"id": "q24-8", "year": 2024, "edition": 16, "number": "五", "title": "从 Dirichlet 积分走向二次、三次幂", "type": "解答题", "points": 14, "difficulty": 5, "topics": ["parts"], "stem": "已知 ∫₀⁺∞ (sin x)/x dx = π/2，计算下面两个反常积分。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"I_1=\\int_0^{\\infty}\\left(\\frac{\\sin x}x\\right)^2dx,\\quad I_2=\\int_0^{\\infty}\\left(\\frac{\\sin x}x\\right)^3dx\"><mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mo>(<\/mo><mfrac><mrow><mi mathvariant=\"normal\">sin<\/mi><mi>x<\/mi><\/mrow><mi>x<\/mi><\/mfrac><msup><mo>)<\/mo><mn>2<\/mn><\/msup><mi>d<\/mi><mi>x<\/mi><mo>,<\/mo><mo> <\/mo><msub><mi>I<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mo>(<\/mo><mfrac><mrow><mi mathvariant=\"normal\">sin<\/mi><mi>x<\/mi><\/mrow><mi>x<\/mi><\/mfrac><msup><mo>)<\/mo><mn>3<\/mn><\/msup><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>", "tex": "I_1=\\int_0^{\\infty}\\left(\\frac{\\sin x}x\\right)^2dx,\\quad I_2=\\int_0^{\\infty}\\left(\\frac{\\sin x}x\\right)^3dx", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"I_1=\\frac\\pi2,\\quad I_2=\\frac{3\\pi}8\"><mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mfrac><mo>π<\/mo><mn>2<\/mn><\/mfrac><mo>,<\/mo><mo> <\/mo><msub><mi>I<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mo>π<\/mo><\/mrow><mn>8<\/mn><\/mfrac><\/mrow><\/math>", "answerText": "I_1=\\frac\\pi2,\\quad I_2=\\frac{3\\pi}8", "steps": [{"title": "先建立缩放关系", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_0^{\\infty}\\frac{\\sin(ax)}x\\,dx=\\frac\\pi2,\\quad a&gt;0\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mfrac><mrow><mi mathvariant=\"normal\">sin<\/mi><mo>(<\/mo><mi>a<\/mi><mi>x<\/mi><mo>)<\/mo><\/mrow><mi>x<\/mi><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>=<\/mo><mfrac><mo>π<\/mo><mn>2<\/mn><\/mfrac><mo>,<\/mo><mo> <\/mo><mi>a<\/mi><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><\/math>", "why": "令 u=ax 即得。这里 a>0，保证积分方向不变。"}, {"title": "对平方项分部积分", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"I_1=\\int_0^{\\infty}\\frac{\\sin2x}x\\,dx=\\frac\\pi2\"><mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mfrac><mrow><mi mathvariant=\"normal\">sin<\/mi><mn>2<\/mn><mi>x<\/mi><\/mrow><mi>x<\/mi><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>=<\/mo><mfrac><mo>π<\/mo><mn>2<\/mn><\/mfrac><\/mrow><\/math><p>取 u=sin²x，dv=dx/x²。边界项 −sin²x/x 在 0 与无穷远处均趋于 0。<\/p>", "why": "原点处 sin²x/x 约为 x，无穷远处绝对值不超过 1/x，所以边界项可以消掉。"}, {"title": "对立方项分部积分，再用积化和差", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"I_2=\\frac34\\int_0^{\\infty}\\frac{\\sin x\\sin2x}{x^2}\\,dx\"><mrow><msub><mi>I<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mfrac><mrow><mi mathvariant=\"normal\">sin<\/mi><mi>x<\/mi><mi mathvariant=\"normal\">sin<\/mi><mn>2<\/mn><mi>x<\/mi><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"=\\frac38\\int_0^{\\infty}\\frac{\\cos x-\\cos3x}{x^2}\\,dx\"><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>8<\/mn><\/mrow><\/mfrac><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mfrac><mrow><mi mathvariant=\"normal\">cos<\/mi><mi>x<\/mi><mo>-<\/mo><mi mathvariant=\"normal\">cos<\/mi><mn>3<\/mn><mi>x<\/mi><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>", "why": "取 u=sin³x，dv=dx/x³。导数产生 3sin²x cos x，再利用 2sin x cos x=sin2x。"}, {"title": "改写成两个平方型积分", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"I_2=\\frac34\\left[\\int_0^{\\infty}\\frac{\\sin^2(3x/2)}{x^2}\\,dx-\\int_0^{\\infty}\\frac{\\sin^2(x/2)}{x^2}\\,dx\\right]\"><mrow><msub><mi>I<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><mo>[<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mfrac><mrow><msup><mi mathvariant=\"normal\">sin<\/mi><mn>2<\/mn><\/msup><mo>(<\/mo><mn>3<\/mn><mi>x<\/mi><mo>/<\/mo><mn>2<\/mn><mo>)<\/mo><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>-<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mrow><mo>∞<\/mo><\/mrow><\/munderover><mfrac><mrow><msup><mi mathvariant=\"normal\">sin<\/mi><mn>2<\/mn><\/msup><mo>(<\/mo><mi>x<\/mi><mo>/<\/mo><mn>2<\/mn><mo>)<\/mo><\/mrow><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>]<\/mo><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"=\\frac34\\left(\\frac{3\\pi}4-\\frac\\pi4\\right)=\\frac{3\\pi}8\"><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><mo>(<\/mo><mfrac><mrow><mn>3<\/mn><mo>π<\/mo><\/mrow><mn>4<\/mn><\/mfrac><mo>-<\/mo><mfrac><mo>π<\/mo><mn>4<\/mn><\/mfrac><mo>)<\/mo><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mo>π<\/mo><\/mrow><mn>8<\/mn><\/mfrac><\/mrow><\/math>", "why": "由换元可得 ∫sin²(ax)/x² dx=aπ/2。应先用 1−cos 的组合改写，不能拆成两个在原点发散的 cos/x² 积分。"}], "hint": "从 sin²x / x² 开始，分部积分时让 x⁻² 被积分，能把问题变回已知的 sin(ax)/x。", "mistake": ["分部积分后省略了反常端点的边界项检验。", "把 cos x/x² 与 cos3x/x² 分别积分；它们在原点并不各自收敛。"], "method": "从已知积分推导相邻幂次：分部积分降分母幂次，再用三角恒等式与缩放关系衔接。", "variant": "先单独验证 ∫₀⁺∞ sin²(ax)/x² dx=aπ/2（a>0），把缩放这一步彻底做熟。", "pages": "7", "accepted": []}, {"id": "q24-9", "year": 2024, "edition": 16, "number": "六", "title": "非负函数与 Lipschitz 导数估计", "type": "证明题", "points": 14, "difficulty": 5, "topics": ["inequality"], "stem": "设 f 在实数轴上为非负函数且有连续导数，存在 M>0，使任意 x、y 都满足下式。证明结论。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"|f^{\\prime}(x)-f^{\\prime}(y)|\\le M|x-y|\\quad\\Rightarrow\\quad(f^{\\prime}(x))^2\\le2Mf(x)\"><mrow><mo>|<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>-<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>y<\/mi><mo>)<\/mo><mo>|<\/mo><mo>≤<\/mo><mi>M<\/mi><mo>|<\/mo><mi>x<\/mi><mo>-<\/mo><mi>y<\/mi><mo>|<\/mo><mo> <\/mo><mi>Rightarrow<\/mi><mo> <\/mo><mo>(<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><msup><mo>)<\/mo><mn>2<\/mn><\/msup><mo>≤<\/mo><mn>2<\/mn><mi>M<\/mi><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><\/mrow><\/math>", "tex": "|f^{\\prime}(x)-f^{\\prime}(y)|\\le M|x-y|\\quad\\Rightarrow\\quad(f^{\\prime}(x))^2\\le2Mf(x)", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"(f^{\\prime}(x))^2\\le2Mf(x)\"><mrow><mo>(<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><msup><mo>)<\/mo><mn>2<\/mn><\/msup><mo>≤<\/mo><mn>2<\/mn><mi>M<\/mi><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><\/mrow><\/math>", "answerText": "(f^{\\prime}(x))^2\\le2Mf(x)", "steps": [{"title": "把函数增量写成积分", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"0\\le f(x+h)=f(x)+hf^{\\prime}(x)+\\int_0^h[f^{\\prime}(x+t)-f^{\\prime}(x)]\\,dt\"><mrow><mn>0<\/mn><mo>≤<\/mo><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>h<\/mi><mo>)<\/mo><mo>=<\/mo><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>+<\/mo><mi>h<\/mi><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>+<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mi>h<\/mi><\/munderover><mo>[<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>t<\/mi><mo>)<\/mo><mo>-<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>]<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>t<\/mi><\/mrow><\/math>", "why": "连续导数允许使用微积分基本定理。减去 f′(x) 是为了直接利用题给的导数差估计。"}, {"title": "估计积分余项", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\left|\\int_0^h[f^{\\prime}(x+t)-f^{\\prime}(x)]\\,dt\\right|\\le\\frac M2h^2\"><mrow><mo>|<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mi>h<\/mi><\/munderover><mo>[<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>t<\/mi><mo>)<\/mo><mo>-<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>]<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>t<\/mi><mo>|<\/mo><mo>≤<\/mo><mfrac><mi>M<\/mi><mn>2<\/mn><\/mfrac><msup><mi>h<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>", "why": "h<0 时要先反转积分上下限再取绝对值；不论 h 的符号如何，上界都是 Mh²/2。"}, {"title": "让 h 与 f′(x) 异号", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"|f^{\\prime}(x)|\\le\\frac{f(x)}{|h|}+\\frac M2|h|\"><mrow><mo>|<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>|<\/mo><mo>≤<\/mo><mfrac><mrow><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><\/mrow><mrow><mo>|<\/mo><mi>h<\/mi><mo>|<\/mo><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mi>M<\/mi><mn>2<\/mn><\/mfrac><mo>|<\/mo><mi>h<\/mi><mo>|<\/mo><\/mrow><\/math>", "why": "由非负性与余项估计得到 −hf′(x)≤f(x)+Mh²/2。让 −hf′(x)=|h||f′(x)|，再除以 |h|。"}, {"title": "选择最合适的步长，并补查零值", "body": "<p>当 f(x)>0 时，取 |h|=√(2f(x)/M)，得到结论。当 f(x)=0 时，上一步对任意 |h|>0 成立，令 |h|→0，得 f′(x)=0。<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"|f^{\\prime}(x)|\\le\\sqrt{2Mf(x)}\"><mrow><mo>|<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>|<\/mo><mo>≤<\/mo><msqrt><mrow><mn>2<\/mn><mi>M<\/mi><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><\/mrow><\/msqrt><\/mrow><\/math>", "why": "正值情形使 A/t 与 Bt 两项平衡。零值不能取 h=0 后再除以 |h|，需单独处理。此处对参考答案的零值边界情况作了补充说明。"}], "hint": "想把 f′ 的差控制住，可以把 f(x+h)−f(x) 写成积分，再减去线性主项 hf′(x)。", "mistake": ["h 为负数时，忽略积分方向。", "取 |h|=√(2f(x)/M) 时，没有单独处理 f(x)=0。"], "method": "函数非负性 + 导数增量控制 → 含步长 h 的估计 → 选取平衡步长。", "variant": "取 f(x)=(M/2)(x−a)²，验证等号是否能成立。", "pages": "8", "accepted": []}, {"id": "q23-1", "year": 2023, "edition": 15, "number": "一（1）", "title": "幂指型极限，凑出 e 的标准结构", "type": "填空题", "points": 6, "difficulty": 2, "topics": ["limit"], "stem": "求下列极限。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\lim_{x\\to\\infty}\\left(\\frac{x+3}{x+2}\\right)^{2x-1}\"><mrow><munder><mo movablelimits=\"true\" largeop=\"true\">lim<\/mo><mrow><mi>x<\/mi><mo>→<\/mo><mo>∞<\/mo><\/mrow><\/munder><mo>(<\/mo><mfrac><mrow><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><\/mrow><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/mfrac><msup><mo>)<\/mo><mrow><mn>2<\/mn><mi>x<\/mi><mo>-<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/math>", "tex": "\\lim_{x\\to\\infty}\\left(\\frac{x+3}{x+2}\\right)^{2x-1}", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"e^2\"><mrow><msup><mi>e<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>", "answerText": "e^2", "steps": [{"title": "底数改写为 1 + 无穷小", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\frac{x+3}{x+2}=1+\\frac1{x+2}\"><mrow><mfrac><mrow><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><\/mrow><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/mfrac><mo>=<\/mo><mn>1<\/mn><mo>+<\/mo><mfrac><mn>1<\/mn><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/mfrac><\/mrow><\/math>", "why": "分子比分母只多 1，先写出“1 加一个趋于零的量”，才看得见标准极限。"}, {"title": "指数与 x+2 对齐", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"2x-1=2(x+2)-5\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>-<\/mo><mn>1<\/mn><mo>=<\/mo><mn>2<\/mn><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><mo>)<\/mo><mo>-<\/mo><mn>5<\/mn><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\left(1+\\frac1{x+2}\\right)^{2x-1}=\\left[\\left(1+\\frac1{x+2}\\right)^{x+2}\\right]^2\\left(1+\\frac1{x+2}\\right)^{-5}\"><mrow><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><mfrac><mn>1<\/mn><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/mfrac><msup><mo>)<\/mo><mrow><mn>2<\/mn><mi>x<\/mi><mo>-<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>=<\/mo><mo>[<\/mo><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><mfrac><mn>1<\/mn><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/mfrac><msup><mo>)<\/mo><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/msup><msup><mo>]<\/mo><mn>2<\/mn><\/msup><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><mfrac><mn>1<\/mn><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/mfrac><msup><mo>)<\/mo><mrow><mo>-<\/mo><mn>5<\/mn><\/mrow><\/msup><\/mrow><\/math>", "why": "前一项趋于 e²，后一项底数趋于 1、指数固定，因此趋于 1。"}, {"title": "分别取极限", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\lim_{x\\to\\infty}\\left(\\frac{x+3}{x+2}\\right)^{2x-1}=e^2\"><mrow><munder><mo movablelimits=\"true\" largeop=\"true\">lim<\/mo><mrow><mi>x<\/mi><mo>→<\/mo><mo>∞<\/mo><\/mrow><\/munder><mo>(<\/mo><mfrac><mrow><mi>x<\/mi><mo>+<\/mo><mn>3<\/mn><\/mrow><mrow><mi>x<\/mi><mo>+<\/mo><mn>2<\/mn><\/mrow><\/mfrac><msup><mo>)<\/mo><mrow><mn>2<\/mn><mi>x<\/mi><mo>-<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>=<\/mo><msup><mi>e<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>", "why": "此题用的是标准幂指型极限，不是把底数先取极限为 1 后再写 1 的无穷次幂。"}], "hint": "先把底数写成 1+1/(x+2)。再看指数 2x−1 与 x+2 之间的关系。", "mistake": ["底数趋于 1，指数趋于无穷，不能直接判极限为 1。", "凑指数时把 2x−1 错写成 2(x+2)−3。"], "method": "识别 1 的无穷次幂：优先凑 (1+1/t)ᵗ；也可取对数，把指数乘入极限。", "variant": "把指数换成 ax+b，试着找出最后结果依赖哪一个参数。", "pages": "1", "accepted": ["e^2", "e²", "exp(2)"]}, {"id": "q23-5", "year": 2023, "edition": 15, "number": "一（5）", "title": "交换积分次序，绕开难求的原函数", "type": "填空题", "points": 6, "difficulty": 4, "topics": ["order", "parts"], "stem": "计算二次积分。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_0^1dx\\int_x^{\\sqrt{x}}\\frac{\\cos y}{y}\\,dy\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mi>d<\/mi><mi>x<\/mi><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mi>x<\/mi><mrow><msqrt><mrow><mi>x<\/mi><\/mrow><\/msqrt><\/mrow><\/munderover><mfrac><mrow><mi mathvariant=\"normal\">cos<\/mi><mi>y<\/mi><\/mrow><mrow><mi>y<\/mi><\/mrow><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>", "tex": "\\int_0^1dx\\int_x^{\\sqrt{x}}\\frac{\\cos y}{y}\\,dy", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"1-\\cos1\"><mrow><mn>1<\/mn><mo>-<\/mo><mi mathvariant=\"normal\">cos<\/mi><mn>1<\/mn><\/mrow><\/math>", "answerText": "1-\\cos1", "steps": [{"title": "先把积分区域写清楚", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"D:\\quad0\\le x\\le1,\\quad x\\le y\\le\\sqrt{x}\"><mrow><mi>D<\/mi><mo>:<\/mo><mo> <\/mo><mn>0<\/mn><mo>≤<\/mo><mi>x<\/mi><mo>≤<\/mo><mn>1<\/mn><mo>,<\/mo><mo> <\/mo><mi>x<\/mi><mo>≤<\/mo><mi>y<\/mi><mo>≤<\/mo><msqrt><mrow><mi>x<\/mi><\/mrow><\/msqrt><\/mrow><\/math>", "why": "内层对 y 积分，说明原区域采用竖直切片。先把上下边界写成不等式，不急于求原函数。"}, {"title": "改为固定 y，确定 x 的范围", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"0\\le y\\le1,\\qquad y^2\\le x\\le y\"><mrow><mn>0<\/mn><mo>≤<\/mo><mi>y<\/mi><mo>≤<\/mo><mn>1<\/mn><mo>,<\/mo><mo> <\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>≤<\/mo><mi>x<\/mi><mo>≤<\/mo><mi>y<\/mi><\/mrow><\/math>", "why": "由 y≤√x 得 y²≤x；由 x≤y 得右边界 x=y。注意 x 与 y 的角色交换了，但区域没有变。"}, {"title": "先对 x 积分", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"I=\\int_0^1dy\\int_{y^2}^{y}\\frac{\\cos y}{y}\\,dx\"><mrow><mi>I<\/mi><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mi>d<\/mi><mi>y<\/mi><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mrow><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mi>y<\/mi><\/mrow><\/munderover><mfrac><mrow><mi mathvariant=\"normal\">cos<\/mi><mi>y<\/mi><\/mrow><mrow><mi>y<\/mi><\/mrow><\/mfrac><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"=\\int_0^1(1-y)\\cos y\\,dy\"><mrow><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mo>(<\/mo><mn>1<\/mn><mo>-<\/mo><mi>y<\/mi><mo>)<\/mo><mi mathvariant=\"normal\">cos<\/mi><mi>y<\/mi><mspace width=\"0.15em\"/><mi>d<\/mi><mi>y<\/mi><\/mrow><\/math>", "why": "对 x 积分时，cos y / y 是常数，乘上区间长度 y−y²，恰好消掉分母 y。"}, {"title": "做最后的一元积分", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"I=\\int_0^1\\cos y\\,dy-\\int_0^1y\\cos y\\,dy=1-\\cos1\"><mrow><mi>I<\/mi><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mi mathvariant=\"normal\">cos<\/mi><mi>y<\/mi><mspace width=\"0.15em\"/><mi>d<\/mi><mi>y<\/mi><mo>-<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mi>y<\/mi><mi mathvariant=\"normal\">cos<\/mi><mi>y<\/mi><mspace width=\"0.15em\"/><mi>d<\/mi><mi>y<\/mi><mo>=<\/mo><mn>1<\/mn><mo>-<\/mo><mi mathvariant=\"normal\">cos<\/mi><mn>1<\/mn><\/mrow><\/math>", "why": "第二项用分部积分：∫y cos y dy=y sin y+cos y。代入 0 与 1 后整理。"}], "hint": "cos y / y 对 y 的原函数不好写，但对 x 积分时它就是常数。试着把区域改写成 y²≤x≤y。", "mistake": ["交换顺序后，内层边界仍沿用旧的 x 与 √x。", "把 y²≤x≤y 的上下限写反。"], "method": "内层难积、但另一变量容易积分时：先画出或写出区域，再交换积分次序。", "variant": "保持区域不变，把 cos y 换成 sin y，沿同一路径再计算一次。", "pages": "1–2", "accepted": ["1-cos1", "1-cos(1)", "1−cos1"]}, {"id": "q23-6", "year": 2023, "edition": 15, "number": "五", "title": "从两个零点，到构造辅助函数", "type": "证明题", "points": 14, "difficulty": 5, "topics": ["rolle"], "stem": "设 f 在 [0,1] 上可导，f(0)>0、f(1)>0，且定积分为零。证明：（1）至少有两个零点；（2）存在 ξ∈(0,1) 使下式成立。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_0^1f(x)\\,dx=0,\\qquad f^{\\prime}(\\xi)+3f^3(\\xi)=0\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>=<\/mo><mn>0<\/mn><mo>,<\/mo><mo> <\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mo>ξ<\/mo><mo>)<\/mo><mo>+<\/mo><mn>3<\/mn><msup><mi>f<\/mi><mn>3<\/mn><\/msup><mo>(<\/mo><mo>ξ<\/mo><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "tex": "\\int_0^1f(x)\\,dx=0,\\qquad f^{\\prime}(\\xi)+3f^3(\\xi)=0", "answer": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\exists\\xi\\in(0,1),\\quad f^{\\prime}(\\xi)+3f^3(\\xi)=0\"><mrow><mo>∃<\/mo><mo>ξ<\/mo><mo>∈<\/mo><mo>(<\/mo><mn>0<\/mn><mo>,<\/mo><mn>1<\/mn><mo>)<\/mo><mo>,<\/mo><mo> <\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mo>ξ<\/mo><mo>)<\/mo><mo>+<\/mo><mn>3<\/mn><msup><mi>f<\/mi><mn>3<\/mn><\/msup><mo>(<\/mo><mo>ξ<\/mo><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "answerText": "\\exists\\xi\\in(0,1),\\quad f^{\\prime}(\\xi)+3f^3(\\xi)=0", "steps": [{"title": "由积分为零找到一个负值点", "body": "<p>如果 f 在整个区间都非负，由连续性及 f(0)>0，会有定积分严格大于零，与条件矛盾。因此内部存在 x₀，使 f(x₀)<0。<\/p>", "why": "不是仅凭“积分为零”就直接说存在负值点，还要用端点正值与连续性排除恒非负的情况。"}, {"title": "分别在负值点两侧找零点", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"0&lt;\\xi_1&lt;x_0&lt;\\xi_2&lt;1,\\quad f(\\xi_1)=f(\\xi_2)=0\"><mrow><mn>0<\/mn><mo>&lt;<\/mo><msub><mo>ξ<\/mo><mn>1<\/mn><\/msub><mo>&lt;<\/mo><msub><mi>x<\/mi><mn>0<\/mn><\/msub><mo>&lt;<\/mo><msub><mo>ξ<\/mo><mn>2<\/mn><\/msub><mo>&lt;<\/mo><mn>1<\/mn><mo>,<\/mo><mo> <\/mo><mi>f<\/mi><mo>(<\/mo><msub><mo>ξ<\/mo><mn>1<\/mn><\/msub><mo>)<\/mo><mo>=<\/mo><mi>f<\/mi><mo>(<\/mo><msub><mo>ξ<\/mo><mn>2<\/mn><\/msub><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "why": "在 [0,x₀] 与 [x₀,1] 上分别使用零点存在定理，保证两个零点位于不同子区间。"}, {"title": "用指数因子构造 F", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"F(x)=f(x)e^{\\int_0^x3f^2(s)\\,ds}\"><mrow><mi>F<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>=<\/mo><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><msup><mi>e<\/mi><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mi>x<\/mi><\/munderover><mn>3<\/mn><msup><mi>f<\/mi><mn>2<\/mn><\/msup><mo>(<\/mo><mi>s<\/mi><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>s<\/mi><\/mrow><\/msup><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"F^{\\prime}(x)=[f^{\\prime}(x)+3f^3(x)]e^{\\int_0^x3f^2(s)\\,ds}\"><mrow><msup><mi>F<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>=<\/mo><mo>[<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>+<\/mo><mn>3<\/mn><msup><mi>f<\/mi><mn>3<\/mn><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>]<\/mo><msup><mi>e<\/mi><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mi>x<\/mi><\/munderover><mn>3<\/mn><msup><mi>f<\/mi><mn>2<\/mn><\/msup><mo>(<\/mo><mi>s<\/mi><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>s<\/mi><\/mrow><\/msup><\/mrow><\/math>", "why": "目标含 f′+3f²·f，与一阶线性微分方程的积分因子结构相似。乘上指数因子后，它就成为一个乘积的导数。"}, {"title": "在两个零点之间使用罗尔定理", "body": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"F(\\xi_1)=F(\\xi_2)=0\\quad\\Rightarrow\\quad F^{\\prime}(\\xi)=0\"><mrow><mi>F<\/mi><mo>(<\/mo><msub><mo>ξ<\/mo><mn>1<\/mn><\/msub><mo>)<\/mo><mo>=<\/mo><mi>F<\/mi><mo>(<\/mo><msub><mo>ξ<\/mo><mn>2<\/mn><\/msub><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><mo> <\/mo><mi>Rightarrow<\/mi><mo> <\/mo><msup><mi>F<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mo>ξ<\/mo><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"f^{\\prime}(\\xi)+3f^3(\\xi)=0\"><mrow><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mo>ξ<\/mo><mo>)<\/mo><mo>+<\/mo><mn>3<\/mn><msup><mi>f<\/mi><mn>3<\/mn><\/msup><mo>(<\/mo><mo>ξ<\/mo><mo>)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "why": "指数因子恒正，从 F′(ξ)=0 可以约去它，正好得到待证式。"}], "hint": "第二问需要罗尔定理，而第一问给了两个零点。关键是构造一个导数里包含 f′+3f³ 的函数。", "mistake": ["只找到一个零点，无法在两个不同零点之间使用罗尔定理。", "构造指数因子时写成 e³ᶠ，而不是含 3f² 的变上限积分。"], "method": "“两个零点 + 导数与函数项的组合”常提示：找积分因子构造辅助函数，再用罗尔定理。", "variant": "把 3f³ 改成 a(x)f(x)，试着写出相应的指数积分因子。", "pages": "6", "accepted": []}], "knowledge": [{"id": "limit", "name": "函数极限", "group": "函数、极限与连续", "desc": "把未定式转化为能使用极限法则的结构，优先识别标准极限。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\lim_{t\\to\\infty}(1+\\frac1t)^t=e\"><mrow><munder><mo movablelimits=\"true\" largeop=\"true\">lim<\/mo><mrow><mi>t<\/mi><mo>→<\/mo><mo>∞<\/mo><\/mrow><\/munder><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><mfrac><mn>1<\/mn><mi>t<\/mi><\/mfrac><msup><mo>)<\/mo><mi>t<\/mi><\/msup><mo>=<\/mo><mi>e<\/mi><\/mrow><\/math>", "prereqs": [], "tip": "先判断型别；幂指型可凑标准形式，也可先取对数。"}, {"id": "taylor", "name": "泰勒展开与无穷小阶", "group": "函数、极限与连续", "desc": "找到第一个不被抵消的项，把复杂极限变成系数之比。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\ln(1+t)=t-\\frac{t^2}{2}+o(t^2)\"><mrow><mi mathvariant=\"normal\">ln<\/mi><mo>(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>t<\/mi><mo>)<\/mo><mo>=<\/mo><mi>t<\/mi><mo>-<\/mo><mfrac><mrow><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><mo>+<\/mo><mi>o<\/mi><mo>(<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>)<\/mo><\/mrow><\/math>", "prereqs": ["limit"], "tip": "相减时不能只保留首项；展开阶数应由抵消情况与分母阶数决定。"}, {"id": "implicit", "name": "隐函数求导", "group": "一元函数微分学", "desc": "没有显式 y(x)，仍可对方程两边求导；每次都带上 y 的链式导数。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"F_x+F_y y^{\\prime}=0\"><mrow><msub><mi>F<\/mi><mi>x<\/mi><\/msub><mo>+<\/mo><msub><mi>F<\/mi><mi>y<\/mi><\/msub><msup><mi>y<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "prereqs": ["chain"], "tip": "在 Fᵧ≠0 等隐函数条件下使用公式。高阶导数通常逐次求导更清楚。"}, {"id": "rolle", "name": "罗尔定理与辅助函数", "group": "一元函数微分学", "desc": "把“存在某点满足导数关系”转化成辅助函数导数为零。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"F(x)=f(x)e^{\\int_0^xa(t)\\,dt}\"><mrow><mi>F<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>=<\/mo><mi>f<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><msup><mi>e<\/mi><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mi>x<\/mi><\/munderover><mi>a<\/mi><mo>(<\/mo><mi>t<\/mi><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>t<\/mi><\/mrow><\/msup><\/mrow><\/math>", "prereqs": [], "tip": "逐项核对连续、可导、两端值相等。辅助函数的构造应从目标导数反推。"}, {"id": "symmetry", "name": "定积分的对称性", "group": "一元函数积分学", "desc": "先识别奇偶、区间与几何结构，再决定是否真的需要求原函数。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_{-a}^{a}g(x)\\,dx=0\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mrow><mo>-<\/mo><mi>a<\/mi><\/mrow><mrow><mi>a<\/mi><\/mrow><\/munderover><mi>g<\/mi><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><\/math>", "prereqs": [], "tip": "公式要求 g 是可积奇函数；偶函数则是两倍半区间积分。"}, {"id": "parts", "name": "分部积分法", "group": "一元函数积分学", "desc": "借助乘积求导的逆过程，把一个积分转成更容易的积分。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_a^bu\\,dv=[uv]_a^b-\\int_a^bv\\,du\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mi>a<\/mi><mi>b<\/mi><\/munderover><mi>u<\/mi><mspace width=\"0.15em\"/><mi>d<\/mi><mi>v<\/mi><mo>=<\/mo><mo>[<\/mo><mi>u<\/mi><mi>v<\/mi><msubsup><mo>]<\/mo><mi>a<\/mi><mi>b<\/mi><\/msubsup><mo>-<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mi>a<\/mi><mi>b<\/mi><\/munderover><mi>v<\/mi><mspace width=\"0.15em\"/><mi>d<\/mi><mi>u<\/mi><\/mrow><\/math>", "prereqs": [], "tip": "反常积分先在有限区间运算，再检查端点极限；不可无条件丢弃边界项。"}, {"id": "inequality", "name": "积分估计与不等式", "group": "一元函数积分学", "desc": "利用非负性、导数增量与可调参数，建立精细的函数估计。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"|f^{\\prime}(x+t)-f^{\\prime}(x)|\\le M|t|\"><mrow><mo>|<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>+<\/mo><mi>t<\/mi><mo>)<\/mo><mo>-<\/mo><msup><mi>f<\/mi><mrow><mo>′<\/mo><\/mrow><\/msup><mo>(<\/mo><mi>x<\/mi><mo>)<\/mo><mo>|<\/mo><mo>≤<\/mo><mi>M<\/mi><mo>|<\/mo><mi>t<\/mi><mo>|<\/mo><\/mrow><\/math>", "prereqs": ["parts"], "tip": "先把差写成积分，再估计余项。涉及除法、开方或选参数时单独检查零值情形。"}, {"id": "chain", "name": "多元复合函数求导", "group": "多元函数微积分", "desc": "把内外层分开，沿每一条依赖路径求导，再把结果相加。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"z_x=f_1u_x+f_2v_x\"><mrow><msub><mi>z<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><msub><mi>f<\/mi><mn>1<\/mn><\/msub><msub><mi>u<\/mi><mi>x<\/mi><\/msub><mo>+<\/mo><msub><mi>f<\/mi><mn>2<\/mn><\/msub><msub><mi>v<\/mi><mi>x<\/mi><\/msub><\/mrow><\/math>", "prereqs": [], "tip": "写清 f₁、f₂ 的含义与取值点；二次求导时不要漏掉系数的乘积法则。"}, {"id": "polar", "name": "极坐标变换", "group": "多元函数微积分", "desc": "圆、扇形和 x²+y² 的组合，往往适合把几何区域变成矩形参数域。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"dx\\,dy=\\rho\\,d\\rho\\,d\\theta\"><mrow><mi>d<\/mi><mi>x<\/mi><mspace width=\"0.15em\"/><mi>d<\/mi><mi>y<\/mi><mo>=<\/mo><mo>ρ<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mo>ρ<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mo>θ<\/mo><\/mrow><\/math>", "prereqs": ["order"], "tip": "先确定角度范围，再定半径上下限；面积微元里的 ρ 必须保留。"}, {"id": "order", "name": "交换积分次序", "group": "多元函数微积分", "desc": "保持同一个区域，改变切片方向，绕开难积的内层变量。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\int_0^1dx\\int_x^{\\sqrt{x}}g(y)\\,dy=\\int_0^1dy\\int_{y^2}^{y}g(y)\\,dx\"><mrow><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mi>d<\/mi><mi>x<\/mi><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mi>x<\/mi><mrow><msqrt><mrow><mi>x<\/mi><\/mrow><\/msqrt><\/mrow><\/munderover><mi>g<\/mi><mo>(<\/mo><mi>y<\/mi><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>y<\/mi><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/munderover><mi>d<\/mi><mi>y<\/mi><munderover><mo movablelimits=\"true\" largeop=\"true\">∫<\/mo><mrow><msup><mi>y<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mi>y<\/mi><\/mrow><\/munderover><mi>g<\/mi><mo>(<\/mo><mi>y<\/mi><mo>)<\/mo><mspace width=\"0.15em\"/><mi>d<\/mi><mi>x<\/mi><\/mrow><\/math>", "prereqs": [], "tip": "先把不等式区域写清楚；遇到折线边界时，交换次序后可能需要分段。"}, {"id": "lagrange", "name": "拉格朗日乘数法", "group": "多元函数微积分", "desc": "每个约束引入一个乘数，通过驻点方程找出条件极值的候选点。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"L=f-\\lambda g-\\mu h\"><mrow><mi>L<\/mi><mo>=<\/mo><mi>f<\/mi><mo>-<\/mo><mo>λ<\/mo><mi>g<\/mi><mo>-<\/mo><mo>μ<\/mo><mi>h<\/mi><\/mrow><\/math>", "prereqs": ["chain"], "tip": "注意约束梯度的正则性，并另外处理不满足条件的点；求最大值还须比较候选值。"}, {"id": "series", "name": "幂级数与 Taylor 级数", "group": "无穷级数", "desc": "从几何级数出发，用拆分、求导或积分得到需要的函数展开。", "formula": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" aria-label=\"\\frac1{1+t}=\\sum_{n=0}^{\\infty}(-1)^nt^n,\\quad |t|&lt;1\"><mrow><mfrac><mn>1<\/mn><mrow><mn>1<\/mn><mo>+<\/mo><mi>t<\/mi><\/mrow><\/mfrac><mo>=<\/mo><munderover><mo movablelimits=\"true\" largeop=\"true\">∑<\/mo><mrow><mi>n<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><mrow><mo>∞<\/mo><\/mrow><\/munderover><mo>(<\/mo><mo>-<\/mo><mn>1<\/mn><msup><mo>)<\/mo><mi>n<\/mi><\/msup><msup><mi>t<\/mi><mi>n<\/mi><\/msup><mo>,<\/mo><mo> <\/mo><mo>|<\/mo><mi>t<\/mi><mo>|<\/mo><mo>&lt;<\/mo><mn>1<\/mn><\/mrow><\/math>", "prereqs": ["taylor"], "tip": "展开中心决定幂的形式；收敛区间的两个端点必须单独判断。"}]}</script>
